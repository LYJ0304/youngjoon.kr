      <img src="https://skillicons.dev/icons?i=java,py,spring,fastapi" alt="Java, Python, Spring Boot, FastAPI" height="48">

footer_show_references: false

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

sass:
  sass_dir: _sass
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor/
