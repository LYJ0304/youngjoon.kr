# about_profile_image: "images/profile.jpg"
about_content: |
  자기소개를 입력하세요.

content:
  - title: "경력"
    layout: list
    content:
      - layout: left
        title: "Republic of Korea Army"
        sub_title: "Software Engineer / Software Development Soldier"
        caption: "2026.04 ~ 현재"
        description: |
          담당 업무와 주요 성과를 입력하세요.

  - title: "프로젝트"
    layout: list
    content:
      - layout: left
        title: "Grow Together"
        caption: "2026.10 ~ 현재"
        link: "https://github.com/LYJ0304/grow-together"
        link_text: "GitHub"
        description: |
          프로젝트 소개, 담당 역할, 사용 기술과 성과를 입력하세요.

  - title: "학력"
    layout: list
    content:
      - layout: left
        title: "충남대학교"
        sub_title: "컴퓨터융합학부"
